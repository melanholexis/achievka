<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ачивка</title>
  <link rel="stylesheet" href="/tour.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><strong>Ачивка</strong></div>
      <nav class="nav" id="nav" aria-label="Разделы Ачивки">
        <button class="nav-btn active" type="button" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v10H3z M9 20v-6h6v6"/></svg><span>Мой путь</span></button>
        <button class="nav-btn" type="button" data-view="steps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg><span>Задания</span></button>
        <button class="nav-btn" type="button" data-view="marks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z"/></svg><span>Достижения</span></button>
        <button class="nav-btn" type="button" data-view="rewards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v11H4z M3 6h18v4H3z M12 6v15 M12 6C5 6 5 0 8 1c2 0 4 5 4 5s2-5 4-5c3-1 3 5-4 5"/></svg><span>Награды</span></button>
        <button class="nav-btn" type="button" data-view="courses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h7l2 3h9v12H3z"/></svg><span>Курсы</span></button>
        <button class="nav-btn" type="button" data-view="link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-3a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v3z M12 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg><span>Профиль и данные</span></button>
      </nav>
      <button class="tour-launch" type="button" data-tour-launch><span aria-hidden="true">▶</span> Демонстрация</button>
      <button class="side-end" type="button" data-view="link" aria-label="Открыть профиль">
        <span class="avatar" id="avatar">А</span>
        <span class="profile-text"><b id="profile-name">Профиль</b><small id="course-name"></small></span>
        <span aria-hidden="true">›</span>
      </button>
    </aside>
    <main class="workspace">
      <header class="top">
        <h1 id="hello">Привет</h1>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
          <input id="search" type="search" placeholder="Поиск по курсу" aria-label="Поиск по курсу" autocomplete="off">
        </label>
        <button class="theme-toggle" id="theme" type="button" aria-label="Переключить тему" aria-pressed="true">
          <span id="theme-label">Тёмная</span><span class="switch" id="theme-switch"><i></i></span>
        </button>
        <button class="menu-btn" id="menu" type="button" aria-label="Меню" aria-expanded="false" aria-controls="menu-panel">⋯</button>
        <div class="menu" id="menu-panel" hidden>
          <div id="menu-courses"></div>
          <button type="button" id="open-course">Открыть курс</button>
          <button type="button" id="manage-courses">Все курсы</button>
          <button type="button" id="rescan">Сканировать сайт</button>
          <button type="button" id="reset">Сбросить мой прогресс</button>
          <button type="button" id="logout">Сменить аккаунт</button>
        </div>
      </header>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <section class="view" id="view-home"></section>
      <section class="view" id="view-steps" hidden></section>
      <section class="view" id="view-marks" hidden></section>
      <section class="view" id="view-rewards" hidden></section>
      <section class="view" id="view-courses" hidden></section>
      <section class="view" id="view-link" hidden></section>
    </main>
  </div>
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><strong>Ачивка</strong></div>
      <h2>Вход</h2>
      <p class="muted">Выбери сохранённый профиль или создай новый.</p>
      <div class="gate-saved" id="gate-saved"></div>
      <label>Имя<input id="gate-name" name="name" autocomplete="name" required maxlength="40"></label>
      <label>Ключ<input id="gate-token" name="token" type="password" autocomplete="off" placeholder="Для переноса профиля"></label>
      <label class="remember"><input id="gate-remember" type="checkbox" checked> Запомнить на этом компьютере</label>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
      <button type="submit" class="primary">Войти</button>
      <button type="button" class="tour-launch" data-tour-launch><span aria-hidden="true">▶</span> Демонстрация</button>
    </form>
  </div>
  <script src="/app.js"></script>
  <script src="/tour.js"></script>
</body>
</html>
